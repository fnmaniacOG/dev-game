[package]
name    = "governance"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "governance"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.0.2"
anchor-spl  = { version = "1.0.2", features = ["token", "idl-build"] }
solana-program = "2.1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
