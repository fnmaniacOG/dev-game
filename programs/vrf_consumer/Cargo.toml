[package]
name    = "vrf_consumer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vrf_consumer"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.0.2"
anchor-spl  = { version = "1.0.2", features = ["token", "idl-build"] }
switchboard-solana = { version = "0.28.0", features = ["cpi"] }
